[project]
name = "neuroweave-backend"
version = "1.0.0"
description = "Autonomous Knowledge Graph Cognitive OS - NeuroWeave"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "httpx>=0.27",
    "mcp>=1.0",
    "fastmcp>=0.2",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "python-dotenv>=1.2.2",
    "tavily-python>=0.7.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
